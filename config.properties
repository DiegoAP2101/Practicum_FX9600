# ============================================================
# Configuracion de conexion - FX9600 Reading Demo
# Edita este archivo y reinicia la aplicacion para aplicar.
# ============================================================

# --- Lectora Zebra FX9600 ---
# IP de la lectora en tu red local
reader.ip=192.168.10.20
# Puerto LLRP de la lectora (5084 es el default de fabrica, no suele cambiar)
reader.port=5084
# Tiempo maximo de espera al conectar, en milisegundos
reader.timeout.ms=10000
# Si se pierde la conexion, reintentar conectar cada N segundos (0 = no reintentar)
reader.reconnect.seconds=10

# --- Servidor web local ---
# Host donde escucha la pagina web:
#   127.0.0.1 = solo esta compu
#   0.0.0.0   = accesible desde otras compus de la red local
web.host=127.0.0.1
# Puerto de la pagina web (la abres en http://localhost:8090)
# Nota: 8080 suele estar ocupado por otros programas; si 8090 tambien
# esta ocupado, cambia el numero y reinicia.
web.port=8090

# --- Modo simulacion (para probar sin lectora) ---
# Tambien se activa ejecutando run-sim.bat (bandera --sim)
sim.enabled=false
# Cuantos tags falsos genera el simulador
sim.tag.count=8
# Lecturas por segundo aproximadas del simulador
sim.reads.per.second=120
